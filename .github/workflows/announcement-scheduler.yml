name: CLGF Scheduled Announcements

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-announcements:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger CLGF announcement scheduler
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 20 \
            --max-time 180 \
            --request POST \
            --header "x-scheduler-secret: $SCHEDULER_SECRET" \
            https://clgf-cms.onrender.com/internal/announcement-scheduler/run
